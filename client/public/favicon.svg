<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164B38" />
      <stop offset="100%" stop-color="#01B574" />
    </linearGradient>
    <linearGradient id="fpOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28B45" />
      <stop offset="100%" stop-color="#FFB074" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#103B2D" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#fpGreen)" filter="url(#shadow)" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Sustainable Food Rescue Leaf 1 (Left - Green) -->
  <path d="M 32 14 C 20 18, 16 32, 28 38 C 30 31, 31 22, 32 14 Z" fill="#48E59B" opacity="0.95" />
  
  <!-- Food Energy Leaf 2 (Right - Golden Orange) -->
  <path d="M 32 14 C 44 18, 48 32, 36 38 C 34 31, 33 22, 32 14 Z" fill="url(#fpOrange)" />

  <!-- Nurturing Community Bowl / Distribution Arc -->
  <path d="M 17 38 C 22 50, 42 50, 47 38 C 42 43, 22 43, 17 38 Z" fill="#FAF7EF" />

  <!-- Central Stem / Golden Grain Sprout -->
  <circle cx="32" cy="34" r="2.5" fill="#FAF7EF" />
</svg>