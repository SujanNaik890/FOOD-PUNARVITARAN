services:
  - type: web
    name: foodbridge-server
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm --workspace=server start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: http://localhost:5173
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: OTP_PEPPER
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
